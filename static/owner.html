<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<title>我的位置 · 控制台</title>
<style>
  :root {
    --bg-0:#05070d; --bg-1:#0a1020;
    --surface:rgba(255,255,255,.05);
    --stroke:rgba(255,255,255,.10); --stroke-strong:rgba(255,255,255,.16);
    --text:#f2f6fc; --muted:#94a3b8;
    --cyan:#38bdf8; --blue:#3b82f6; --green:#34d399; --red:#f43f5e;
    --grad:linear-gradient(135deg,#38bdf8,#3b82f6);
    --grad-danger:linear-gradient(135deg,#f43f5e,#e11d48);
  }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; min-height:100%; background:var(--bg-0); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }
  .glow { position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(60% 40% at 85% -5%, rgba(59,130,246,.22), transparent 60%),
      radial-gradient(50% 35% at 10% 110%, rgba(56,189,248,.14), transparent 60%),
      linear-gradient(180deg,var(--bg-1),var(--bg-0)); }
  .app { position:relative; z-index:1; max-width:520px; margin:0 auto; min-height:100dvh;
    display:flex; align-items:center; justify-content:center; padding:24px 14px; }
  .card { width:100%; background:var(--surface); border:1px solid var(--stroke);
    border-radius:24px; padding:30px 24px; backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    box-shadow:0 18px 50px rgba(0,0,0,.35); animation:fadeUp .55s cubic-bezier(.22,1,.36,1) both; text-align:center; }
  .badge { display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:500;
    color:#a7f3d0; background:rgba(52,211,153,.08); border:1px solid rgba(52,211,153,.22);
    border-radius:999px; padding:6px 13px; }
  .badge .dot { width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 8px rgba(52,211,153,.9); }
  .badge.stopped { color:var(--muted); background:rgba(255,255,255,.05); border-color:var(--stroke); }
  .badge.stopped .dot { background:#64748b; box-shadow:none; }
  h1 { font-size:21px; font-weight:600; margin:18px 0 6px; }
  p.sub { font-size:14px; color:var(--muted); margin:0 0 24px; line-height:1.7; }
  input { width:100%; font-size:20px; letter-spacing:4px; text-align:center; padding:14px;
    border-radius:14px; border:1px solid var(--stroke-strong); background:rgba(255,255,255,.04);
    color:var(--text); outline:none; }
  input:focus { border-color:rgba(56,189,248,.7); box-shadow:0 0 0 4px rgba(56,189,248,.18); }
  .error { min-height:22px; font-size:13px; color:#fda4af; margin-top:12px; }
  .btn { display:flex; align-items:center; justify-content:center; gap:8px; min-height:48px;
    width:100%; border-radius:14px; border:1px solid var(--stroke-strong); background:rgba(255,255,255,.06);
    color:var(--text); font-size:15px; font-weight:500; cursor:pointer; font-family:inherit;
    transition:transform .1s, opacity .15s, box-shadow .15s; }
  .btn:active { transform:scale(.98); }
  .btn-danger { background:var(--grad-danger); border-color:transparent; color:#fff; box-shadow:0 8px 24px rgba(225,29,72,.3); }
  .btn-ok { background:var(--grad); border-color:transparent; color:#fff; box-shadow:0 8px 24px rgba(56,189,248,.3); }
  .btn-row { display:flex; flex-direction:column; gap:12px; margin-top:20px; }
  .link { display:inline-block; margin-top:16px; font-size:13px; color:var(--muted); text-decoration:none; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="app">
  <div class="card" id="card">
    <div id="view-login" hidden>
      <h1>共享人控制台</h1>
      <p class="sub">输入控制台密码，管理位置共享</p>
      <input id="pass" type="password" inputmode="numeric" autocomplete="off" placeholder="密码">
      <div class="error" id="error" role="alert" aria-live="polite"></div>
      <div class="btn-row"><button class="btn btn-ok" id="login-btn" type="button">进入控制台</button></div>
    </div>
    <div id="view-control" hidden>
      <span class="badge" id="badge"><span class="dot"></span><span id="badge-text">共享中</span></span>
      <h1>位置共享</h1>
      <p class="sub" id="desc">朋友打开网站即可看到你的实时位置</p>
      <div class="btn-row">
        <button class="btn btn-danger" id="stop-btn" type="button">停止共享</button>
        <button class="btn btn-ok" id="start-btn" type="button">恢复共享</button>
      </div>
      <a class="link" href="/map" target="_blank">打开朋友端页面看看效果 →</a>
      <a class="link" href="/api/logout">退出登录</a>
    </div>
  </div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const loginView = $("view-login"), ctrlView = $("view-control");
  const error = $("error");

  async function checkState() {
    try {
      const res = await fetch("/api/state", { cache: "no-store" });
      if (res.status === 401) { loginView.hidden = false; return; }
      const d = await res.json();
      if (!d.ok) return;
      loginView.hidden = true;
      ctrlView.hidden = false;
      apply(d.stopped);
    } catch (e) { /* 忽略 */ }
  }

  function apply(stopped) {
    $("badge").classList.toggle("stopped", stopped);
    $("badge-text").textContent = stopped ? "已停止共享" : "共享中";
    $("desc").textContent = stopped
      ? "朋友打开网站会看到“已停止共享”，点下方按钮可恢复"
      : "朋友打开网站即可看到你的实时位置";
    $("stop-btn").disabled = stopped;
    $("start-btn").disabled = !stopped;
  }

  $("login-btn").addEventListener("click", async () => {
    const res = await fetch("/api/owner_login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pass: $("pass").value }),
    });
    const d = await res.json();
    if (res.ok && d.ok) { error.textContent = ""; checkState(); }
    else error.textContent = d.error || "密码错误";
  });
  $("pass").addEventListener("keydown", e => { if (e.key === "Enter") $("login-btn").click(); });

  async function act(action) {
    await fetch("/api/owner_action", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action }),
    });
    checkState();
  }
  $("stop-btn").addEventListener("click", () => act("stop"));
  $("start-btn").addEventListener("click", () => act("start"));

  checkState();
})();
</script>
</body>
</html>
